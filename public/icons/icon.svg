<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1338"/>
      <stop offset="50%" stop-color="#0e0c18"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Purple Glow Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Inner Coin Shadow & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Glow -->
  <rect x="6" y="6" width="500" height="500" rx="124" fill="none" stroke="url(#purpleGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Ambient Radial -->
  <circle cx="256" cy="256" r="170" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Golden Ring / Coin Shield -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="132" fill="#131122" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Decorative Ring Dots -->
  <circle cx="256" cy="116" r="4" fill="#fbbf24"/>
  <circle cx="396" cy="256" r="4" fill="#fbbf24"/>
  <circle cx="256" cy="396" r="4" fill="#fbbf24"/>
  <circle cx="116" cy="256" r="4" fill="#fbbf24"/>

  <!-- Central "F" & Financial Growth Arrow Symbol -->
  <!-- Vertical stem of the "F" -->
  <rect x="190" y="172" width="28" height="168" rx="14" fill="url(#goldGrad)"/>
  
  <!-- Upper horizontal bar with dynamic angle -->
  <rect x="190" y="172" width="120" height="28" rx="14" fill="url(#goldGrad)"/>
  <circle cx="310" cy="186" r="14" fill="url(#goldGrad)"/>

  <!-- Middle horizontal bar -->
  <rect x="190" y="240" width="85" height="24" rx="12" fill="url(#goldGrad)"/>
  <circle cx="275" cy="252" r="12" fill="url(#goldGrad)"/>

  <!-- Upward Trend Accent Indicator -->
  <path d="M 285 305 L 325 265 L 340 280 L 345 235 L 300 240 L 315 255 L 275 295 Z" fill="#22c55e"/>
</svg>
